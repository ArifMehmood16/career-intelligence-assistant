# Current chunk/verdict scoring. Starting values, not evaluation measurements.
[v2]
version = "scoring-rubric-v2"

[v2.dimension_weights]
match = 0.5
experience = 0.3
seniority = 0.2

[v2.weights]
must_have = 3
desirable = 1

[v2.recency]
within_2y = 1.0
from_2y_to_5y = 0.85
over_5y = 0.7
undated = 0.85

[v2.bands]
strong_match_min = 75
partial_match_min = 50

# A must-have whose match is at or below this caps the band at partial.
[v2.gate]
must_have_match_max = 1
